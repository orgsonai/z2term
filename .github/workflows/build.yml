name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 既存タグへ後から APK を足したいとき用 (タグ push 時の workflow はその時点の定義で走るため、
  # workflow を直した後に打ち直さずに済ませる手段が要る)。指定タグを checkout してビルドし、
  # そのタグのリリースへアセットを追加/差し替えする。
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースするタグ (例: v0.8.190-alpha)'
        required: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手動実行では release ジョブと同じ ref (入力タグ) を検査する。
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 既定の 'tools'(廃止メタパッケージ)は emulator を引き込みダウンロード破損で失敗する。
          # ビルド/lint/ユニットテストに emulator は不要なので platform-tools のみ入れる。
          packages: 'platform-tools'

      - name: Grant gradlew exec permission
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install tools for bundled rootfs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - name: Generate bundled assets
        # フォント取得は api.github.com を叩く。未認証だと IP 単位 60 req/h でランナー間で
        # 食い合うため、組み込みトークンを渡してレート上限を上げる。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-fonts.sh
          bash scripts/build-alpine-rootfs.sh

      - name: Lint
        run: ./gradlew lintFullDebug --stacktrace

      - name: Build Full Debug APK
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testFullDebugUnitTest testFossDebugUnitTest --stacktrace

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: z2term-full-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          retention-days: 14

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: z2term-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          retention-days: 14

  # tag (v*) を push すると、署名済み release APK を foss / full 両方ビルドして
  # GitHub Release に添付する。認証は Actions 組み込みの GITHUB_TOKEN (PAT 不要)。
  # full は Alpine rootfs 同梱、foss は実行時取得としてCIから出す。
  release:
    name: Publish release APKs to GitHub
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # GitHub Release の作成/アセット添付に必要
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手動実行では入力タグの時点をビルドする (版数がタグと食い違わないように)。
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 既定の 'tools'(廃止メタパッケージ)は emulator を引き込みダウンロード破損で失敗する。
          # release APK ビルドに emulator は不要なので platform-tools のみ入れる。
          packages: 'platform-tools'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # 署名鍵の secret が無いと debug 署名になり、既存リリースの更新として入らない。
          # 公開ビルドで debug 署名は事故なので、明示的に失敗させる。
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Grant gradlew exec permission
        run: chmod +x ./gradlew

      - name: Install tools for bundled rootfs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - name: Generate bundled assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-fonts.sh
          bash scripts/build-alpine-rootfs.sh

      # フレーバーは 1 回の gradle 実行にまとめず直列で回す。
      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Build FULL release APK
        run: ./gradlew assembleFullRelease --stacktrace

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FOSS=app/build/outputs/apk/foss/release/app-foss-release.apk
          FULL=app/build/outputs/apk/full/release/app-full-release.apk
          TAG="${{ inputs.tag || github.ref_name }}"
          # flavor の役割をサイズだけで推測せず、APKの内容で強制する。
          if unzip -l "$FOSS" | grep -q 'assets/alpine-minirootfs'; then
            echo "::error::$FOSS bundles the Alpine rootfs."
            exit 1
          fi
          if ! unzip -l "$FULL" | grep -q 'assets/alpine-minirootfs-aarch64.tgz'; then
            echo "::error::$FULL does not bundle the Alpine rootfs."
            exit 1
          fi
          for apk in "$FOSS" "$FULL"; do
            if unzip -l "$apk" | grep -Eq 'lib(proot|talloc|android-shmem)'; then
              echo "::error::$apk contains a removed third-party native engine."
              exit 1
            fi
          done
          # 署名が release 鍵であること (= debug 署名で公開していないこと) を出荷前に確かめる。
          # 鍵の有無は Decode keystore で既に落としているので、これは最終確認。
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            for apk in "$FOSS" "$FULL"; do
              if "$APKSIGNER" verify --print-certs "$apk" | grep -q 'CN=Android Debug'; then
                echo "::error::$apk is debug-signed — refusing to publish."
                exit 1
              fi
            done
          else
            echo "::warning::apksigner not found — skipped the signature check."
          fi
          # 既にリリースがある (手動作成含む) 場合はアセットだけ差し替え、無ければ新規作成 (Latest)。
          # 本文はリリースページ側で持つ。CI は本文を書かないし、既存の本文も上書きしない。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FOSS" "$FULL" --clobber
          else
            gh release create "$TAG" "$FOSS" "$FULL" --title "$TAG" --generate-notes --latest
          fi
