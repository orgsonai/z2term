name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 既定の 'tools'(廃止メタパッケージ)は emulator を引き込みダウンロード破損で失敗する。
          # ビルド/lint/ユニットテストに emulator は不要なので platform-tools のみ入れる。
          packages: 'platform-tools'

      - name: Grant gradlew exec permission
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # full フレーバーは git 管理外の同梱物(フォント/PRoot/Alpine rootfs)を APK に同梱する。
      # これらは生成スクリプトの成果物で .gitignore 対象のため fresh checkout の CI には存在せず、
      # build.gradle.kts の verifyBundledFonts / verifyFullBundledArtifacts 検査でビルドが止まる。
      # full のビルド(lint 含む)より前に生成しておく。z2root の .so は buildZ2rootNative が
      # runner プリインストール NDK(ANDROID_NDK_ROOT)で自動生成するためここでは不要。
      - name: Install host tools for bundled-asset generation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot unzip xz-utils

      - name: Generate bundled assets (fonts / PRoot / Alpine rootfs)
        # フォント取得は api.github.com を叩く。未認証だと IP 単位 60 req/h でランナー間で
        # 食い合うため、組み込みトークンを渡してレート上限を上げる。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-fonts.sh
          bash scripts/build-proot.sh
          bash scripts/build-alpine-rootfs.sh

      - name: Lint
        run: ./gradlew lintFullDebug --stacktrace

      - name: Build Full Debug APK
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testFullDebugUnitTest testFossDebugUnitTest --stacktrace

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: z2term-full-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          retention-days: 14

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: z2term-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          retention-days: 14

  # tag (v*) を push すると、署名済み FOSS release APK をビルドして GitHub Release に添付する。
  # 認証は Actions 組み込みの GITHUB_TOKEN (PAT 不要)。full は同梱 rootfs が重いため当面 CI 対象外
  # (手動リリース)。foss は fonts のみ同梱すればよく、proot/Alpine rootfs 生成は不要。
  release:
    name: Publish FOSS release APK to GitHub
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # GitHub Release の作成/アセット添付に必要
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 既定の 'tools'(廃止メタパッケージ)は emulator を引き込みダウンロード破損で失敗する。
          # release APK ビルドに emulator は不要なので platform-tools のみ入れる。
          packages: 'platform-tools'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # 署名鍵の secret が無いと debug 署名になり、既存リリースの更新として入らない。
          # 公開ビルドで debug 署名は事故なので、明示的に失敗させる。
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Grant gradlew exec permission
        run: chmod +x ./gradlew

      - name: Install host tools for bundled fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip

      - name: Generate bundled fonts (foss も src/main/assets/fonts が必要)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-fonts.sh

      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/foss/release/app-foss-release.apk
          TAG="${GITHUB_REF_NAME}"
          # 既にリリースがある (手動作成含む) 場合はアセット差し替え、無ければ新規作成 (Latest)。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" --generate-notes --latest
          fi
