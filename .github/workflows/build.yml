name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew exec permission
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # full フレーバーは git 管理外の同梱物(フォント/PRoot/Alpine rootfs)を APK に同梱する。
      # これらは生成スクリプトの成果物で .gitignore 対象のため fresh checkout の CI には存在せず、
      # build.gradle.kts の verifyBundledFonts / verifyFullBundledArtifacts 検査でビルドが止まる。
      # full のビルド(lint 含む)より前に生成しておく。z2root の .so は buildZ2rootNative が
      # runner プリインストール NDK(ANDROID_NDK_ROOT)で自動生成するためここでは不要。
      - name: Install host tools for bundled-asset generation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot unzip xz-utils

      - name: Generate bundled assets (fonts / PRoot / Alpine rootfs)
        run: |
          bash scripts/fetch-fonts.sh
          bash scripts/build-proot.sh
          bash scripts/build-alpine-rootfs.sh

      - name: Lint
        run: ./gradlew lintFullDebug --stacktrace

      - name: Build Full Debug APK
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testFullDebugUnitTest testFossDebugUnitTest --stacktrace

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: z2term-full-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          retention-days: 14

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: z2term-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          retention-days: 14

  release:
    name: Build Release Bundle
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
          fi

      - name: Grant gradlew exec permission
        run: chmod +x ./gradlew

      - name: Build Release Bundles (full + foss)
        run: ./gradlew bundleFullRelease bundleFossRelease --stacktrace

      - name: Upload full release bundle
        uses: actions/upload-artifact@v4
        with:
          name: z2term-full-release-aab
          path: app/build/outputs/bundle/fullRelease/app-full-release.aab
          retention-days: 90

      - name: Upload foss release bundle
        uses: actions/upload-artifact@v4
        with:
          name: z2term-foss-release-aab
          path: app/build/outputs/bundle/fossRelease/app-foss-release.aab
          retention-days: 90
