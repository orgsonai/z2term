# F-Droid metadata (fdroiddata へ提出する内容の控え)。
#
# ⚠ ファイル名は applicationId と一致させること (F-Droid の要求)。
#    0.8.359 で full フレーバーを廃止し、配布は 1 種類だけになった。
#    以前は foss に applicationIdSuffix = ".foss" が付いていて
#    (full と同居させるための設計) ファイル名も .foss 付きだったが、
#    同居する相手が無くなったのでサフィックスごと外してある。
#
# z2root / z2accept / z2attach はソースからビルドし、rootfs は実行時取得する。
# 提出手順は docs/FDROID.md にある。

Categories:
  - System
  - Development
License: GPL-3.0-only
AuthorName: orgson
WebSite: https://orgsonai.github.io/z2term/
SourceCode: https://github.com/orgsonai/z2term
IssueTracker: https://github.com/orgsonai/z2term/issues
Changelog: https://github.com/orgsonai/z2term/releases

AutoName: Z2Term
# Summary / Description はここに書かない。店頭の説明はこのリポジトリの
# metadata/<locale>/ (short_description.txt / full_description.txt) から読まれる。
# fdroiddata 側のレシピに重ねて書くと審査で外すよう求められる (docs/FDROID.md §3)。

RepoType: git
Repo: https://github.com/orgsonai/z2term

Builds:
  - versionName: 1.0.1
    versionCode: 699
    # タグ名ではなくコミットの完全なハッシュで指す (fdroiddata の決まり)。v1.0.1 のコミット。
    commit: 725b2088ade7190240bb8d4bc058cda2edbede57
    subdir: app
    # NDK は fdroidserver が sdkmanager で自動導入し、パスを $$NDK$$ で渡してくる。
    # ソースは NDK 27 以降で確認している。
    ndk: r27c
    # prebuild 1: AGP に使わせる NDK 版を local.properties へ書く。
    #   fdroidserver が local.properties に書くのは ndk.dir だけだが、
    #   app/build.gradle.kts が見るのは ndk.version (PC と実機で必要な NDK が
    #   違うため、直書きせず環境ごとに切り替える作りにしてある)。NDK 同梱の
    #   source.properties から Pkg.Revision を写して渡す。
    #   local.properties は prebuild より前に作られるので追記でよい。
    # prebuild 2: プログラミングフォント (*.ttf) は git に入っておらず、F-Droid では
    #   同梱しない (下の注記)。app/build.gradle.kts の verifyBundledFonts は「同梱漏れ」を
    #   ビルドエラーにするので、F-Droid のビルドではこのフラグで警告へ格下げする。
    #   これが無いと assembleRelease が必ず「fonts が見つかりません」で止まる。
    #   フォント不在時は TerminalFonts が端末の monospace へ落とすので動作に支障はない。
    # prebuild 3: z2root / z2accept / z2attach を app/src/main/cpp/ のソースから
    #   NDK clang でビルドし jniLibs へ置く。prebuilt は同梱していない
    #   (Android 10+ は nativeLibraryDir からの execve しか許さないため、
    #   自前ビルドでも .so という名前での同梱が要る)。
    prebuild:
      - "grep Pkg.Revision $$NDK$$/source.properties | tr -d ' ' | sed s/Pkg.Revision=/ndk.version=/ >> ../local.properties"
      - "echo allowMissingBundledAssets=true >> ../gradle.properties"
      - "ANDROID_NDK_HOME=$$NDK$$ bash ../scripts/build-z2root.sh"
    # scanner は「ソースツリーに置かれたバイナリ」を一律で弾く (scan は prebuild の
    # 後に走るので、生成したばかりの .so も対象に入る)。次の 2 つは正当な例外:
    #   - jniLibs/arm64-v8a  : 直前の prebuild が **ソースから生成した** 実行体。
    #                          git には入っておらず (.gitignore 済み)、同梱物ではない。
    #   - kkc_matrix.bin     : かな漢字変換の品詞接続コスト表。int16 の数表であって
    #                          実行コードではない。出典と著作権表示は
    #                          app/src/main/assets/KKC-DICT-NOTICE.txt にある。
    scanignore:
      - app/src/main/jniLibs/arm64-v8a
      - app/src/main/assets/kkc_matrix.bin
    gradle:
      - yes

# ⚠ プログラミングフォント (IBM Plex Mono / JetBrains Mono / Fira Code) は
#    scripts/fetch-fonts.sh がネットワークから取得するもので git に入っていない。
#    F-Droid のビルドではネットワーク取得を避けたいので **同梱しない**。
#    TerminalFonts.isAvailable() が assets を確認し、無ければ端末の monospace に
#    フォールバックする作りなので、フォント選択肢が減るだけで動作に支障はない。

AutoUpdateMode: Version
# 最初の提出は安定版 1.0.1 (1.0.0 の直後の版)。-alpha 付きのタグは F-Droid では拾わない (docs/FDROID.md §6)。
UpdateCheckMode: Tags ^v[0-9.]+$
