# F-Droid metadata (fdroiddata へ提出する内容の控え)。
#
# ⚠ ファイル名は applicationId と一致させること (F-Droid の要求)。
#    0.8.359 で full フレーバーを廃止し、配布は 1 種類だけになった。
#    以前は foss に applicationIdSuffix = ".foss" が付いていて
#    (full と同居させるための設計) ファイル名も .foss 付きだったが、
#    同居する相手が無くなったのでサフィックスごと外してある。
#
# z2root / z2accept / z2attach はソースからビルドし、rootfs は実行時取得する。
# 提出手順は docs/FDROID.md にある。

Categories:
  - System
  - Development
License: GPL-3.0-only
AuthorName: orgson
WebSite: https://orgsonai.github.io/z2term/
SourceCode: https://github.com/orgsonai/z2term
IssueTracker: https://github.com/orgsonai/z2term/issues
Changelog: https://github.com/orgsonai/z2term/releases

AutoName: Z2Term
# Summary / Description はここに書かない。店頭の説明はこのリポジトリの
# metadata/<locale>/ (short_description.txt / full_description.txt) から読まれる。
# fdroiddata 側のレシピに重ねて書くと審査で外すよう求められる (docs/FDROID.md §3)。

RepoType: git
Repo: https://github.com/orgsonai/z2term

Builds:
  - versionName: 1.0.50
    versionCode: 748
    # タグ名ではなくコミットの完全なハッシュで指す (fdroiddata の決まり)。v1.0.50 のコミット。
    commit: b18042b9bd83b9261cf1f30f869418c8d2ea09eb
    subdir: app
    # NDK は fdroidserver が sdkmanager で自動導入し、パスを $$NDK$$ で渡してくる。
    # ソースは NDK 27 以降で確認している。
    ndk: r27c
    # prebuild 1: AGP に使わせる NDK 版を local.properties へ書く。
    #   fdroidserver が local.properties に書くのは ndk.dir だけだが、
    #   app/build.gradle.kts が見るのは ndk.version (PC と実機で必要な NDK が
    #   違うため、直書きせず環境ごとに切り替える作りにしてある)。NDK 同梱の
    #   source.properties から Pkg.Revision を写して渡す。
    #   local.properties は prebuild より前に作られるので追記でよい。
    # prebuild 2: **1.0.3 までの版**はプログラミングフォント (*.ttf) が git に入っておらず、
    #   F-Droid のビルドには入らない (下の注記)。app/build.gradle.kts の verifyBundledFonts は
    #   「同梱漏れ」をビルドエラーにするので、このフラグで警告へ格下げする。
    #   これが無いと assembleRelease が必ず「fonts が見つかりません」で止まる。
    #   フォント不在時は TerminalFonts が端末の monospace へ落とすので動作に支障はない。
    #   1.0.4 以降はフォントが git にあるので、このフラグは何も格下げしない (付いていて無害)。
    # ⚠ z2root など 6 つのネイティブ (app/src/main/cpp/ のソースから NDK clang で作り
    #   jniLibs へ置く実行体) は **prebuild では作らない**。Gradle の buildZ2rootNative が
    #   assembleRelease の中で scripts/build-z2root.sh を呼ぶので、ビルドの段階で作られる。
    #   NDK の場所は fdroidserver が渡す環境変数 ANDROID_NDK_HOME から拾う。
    #   審査で「ライブラリは build で作ること」と指摘され、2026-10-12 に prebuild から外した
    #   (prebuild で作ると scanner の前にバイナリが出来てしまい、scanignore が要った)。
    prebuild:
      - "grep Pkg.Revision $$NDK$$/source.properties | tr -d ' ' | sed s/Pkg.Revision=/ndk.version=/ >> ../local.properties"
      - "echo allowMissingBundledAssets=true >> ../gradle.properties"
      # prebuild 3: REQUEST_INSTALL_PACKAGES をマニフェストから外す。この権限は GitHub 版のアプリ内更新
      #   (z2-update) のためだけにあり、F-Droid から入れた版では isManagedByStore で更新そのものを断るので
      #   使わない。審査で Reports タブの警告を「直すか説明する」よう求められ、使わないものは外すことにした
      #   (2026-10-15)。F-Droid の APK を手で入れた場合は、更新が「許可が要る」で止まるだけ (署名も違うので
      #   GitHub の APK では上書きできない)。サブディレクトリ app で走るのでパスは src/main/ から。
      - "sed -i -e '/android.permission.REQUEST_INSTALL_PACKAGES/d' src/main/AndroidManifest.xml"
    # scanner は「ソースツリーに置かれたバイナリ」を一律で弾く。次の 1 つは正当な例外:
    #   - kkc_matrix.bin     : かな漢字変換の品詞接続コスト表。int16 の数表であって
    #                          実行コードではない。出典と著作権表示は
    #                          app/src/main/assets/KKC-DICT-NOTICE.txt にある。
    scanignore:
      - app/src/main/assets/kkc_matrix.bin
    gradle:
      - yes

# ⚠ プログラミングフォント (IBM Plex Mono / JetBrains Mono / Fira Code。いずれも OFL-1.1) は
#    **1.0.4 から git に入っている**ので、F-Droid のビルドにもそのまま入る。
#    1.0.5 からは自作の Z2 Mono (OFL-1.1) も入る。生成スクリプトは scripts/z2-mono/build.py。
#    1.0.3 までは scripts/fetch-fonts.sh がビルド前にネットワークから取る作りで、
#    F-Droid のビルドには入らず、端末の monospace だけになっていた。

AutoUpdateMode: Version
# 提出は安定版から。最初は 1.0.1 で出し、審査中に 1.0.5 (フォント 4 つを含む版)、続いて 1.0.9、1.0.12、1.0.15、1.0.19、1.0.28、1.0.47、1.0.50 へ向け直した (新しい版を出したらレシピも合わせるよう審査で求められている)。-alpha 付きのタグは F-Droid では拾わない (docs/FDROID.md §6)。
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.50
CurrentVersionCode: 748
