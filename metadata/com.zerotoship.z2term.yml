AutoName: Z2Term
Summary: Android terminal with rootless Linux, SSH and GUI
Description: |-
  Z2Term (ズィートゥーターム) は Android 端末上で動作する独自実装の
  ターミナルアプリです。

  特徴:
  - root 不要で Alpine / Ubuntu / Arch / Kali を起動 (既定エンジンは z2root。PRoot / chroot にも切替可)
  - VT100 / xterm 互換のエスケープシーケンス処理 (OSC 4/7/8/10/11/12/52)
  - 9 種類の同梱テーマ + 独自テーマの作成 + カスタムフォント
  - 代替スクリーン (vim/htop) / 5,000 行スクロールバック (検索付き)
  - マルチタブ / フォアグラウンドサービスでバックグラウンド維持
  - Linux GUI (Xvnc + 内蔵 RFB クライアント。音声・動画つき)
  - SSH / SFTP クライアント (公開鍵認証・秘匿情報は Android Keystore で暗号化)
  - 内蔵 sshd (既定は localhost のみ bind)
  - 日本語 IME (かな漢字変換・予測・学習) + 独自オンスクリーンキーボード
  - 端末から Android を呼ぶブリッジ (通知・クリップボード・電池・センサー・アラーム・Intent ほか)
  - 常駐サーバー (任意のサーバーを起動コマンドとして登録し常駐)
  - 端末ログ (表示内容をワンタップでテキストファイルに記録)
  - 他アプリの共有シートからテキスト / ファイルを受け取る (挿入のみ・実行しない)
  - テレメトリ・解析なし。完全ローカル (foss 版のみ初回にディストロを DL し SHA-256 検証)

  Zero to Ship Project の第 5 作目。

