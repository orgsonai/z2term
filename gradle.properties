# Z2Term Gradle Properties
# AGP の JdkImageTransform (jlink) が JDK 26 で失敗するため、Java 17 でビルドすること。
# JDK の場所はマシンごとに違う（CI は setup-java が用意する）ので、ここには書かない。
# ローカルで JDK 17 を固定したい場合は、リポ外の ~/.gradle/gradle.properties に
#   org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
# のように各自のパスを書く（リポにはコミットされない）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# NDK / Native
android.useFullClasspathForDexingTransform=true
